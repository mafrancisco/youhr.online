services:

  # ── PHP-FPM application ────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ironone_app
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-ironone}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - .:/var/www
      - /var/www/vendor
      - /var/www/node_modules
    networks:
      - ironone
    depends_on:
      db:
        condition: service_healthy

  # ── Nginx web server ───────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: ironone_nginx
    restart: unless-stopped
    ports:
      - "8082:80"
    volumes:
      - .:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - ironone
    depends_on:
      - app

  # ── MySQL database ─────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: ironone_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_DATABASE: ${DB_DATABASE:-ironone}
    ports:
      - "3307:3306"
    volumes:
      - db_vol:/var/lib/mysql
    networks:
      - ironone
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "--password=${DB_PASSWORD:-secret}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ── Mailpit (email testing) ───────────────────────────────────────
  mailpit:
    image: axllent/mailpit
    container_name: ironone_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - ironone

networks:
  ironone:
    driver: bridge

volumes:
  db_vol:
