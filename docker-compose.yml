services:

  # ── PHP-FPM application ────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ironone_app
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
    volumes:
      - public_vol:/var/www/public
      - storage_vol:/var/www/storage
    networks:
      - ironone
    depends_on:
      db:
        condition: service_healthy

  # ── Nginx web server ───────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: ironone_nginx
    restart: unless-stopped
    ports:
      - "8082:80"
    volumes:
      - public_vol:/var/www/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - ironone
    depends_on:
      - app

  # ── MySQL database ─────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: ironone_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD:-secret}"
      MYSQL_DATABASE: "${DB_DATABASE:-ironone}"
    volumes:
      - db_vol:/var/lib/mysql
    networks:
      - ironone
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost",
             "-u", "root", "--password=${DB_PASSWORD:-secret}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

networks:
  ironone:
    driver: bridge

volumes:
  public_vol:
  storage_vol:
  db_vol:
